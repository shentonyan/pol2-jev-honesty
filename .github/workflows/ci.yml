name: ci
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: |
          joh metamorphic --mock --no-ledger
          joh sycophancy --mock --mock-sycophancy-bias 1 --no-ledger
